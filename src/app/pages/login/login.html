<app-default-login-layout
  title="Login into your account"
  primaryBtnText="Login Now"
  secondaryBtnText="Signup Now"
>
  <form [formGroup]="loginForm">
    <app-primary-input
      formControlName="email"
      inputName="email"
      type="email"
      label="Email"
      placeHolder="woodypecker@outlook.com"
    >
      <img src="images/email-icon.svg" alt="" />
    </app-primary-input>

    <app-primary-input
      formControlName="password"
      inputName="password"
      type="password"
      label="Your password"
    >
      <img src="images/password-icon.svg" alt="" />
    </app-primary-input>
  </form>
</app-default-login-layout>
